name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Fast gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run typecheck:web

      - name: Type-check e2e
        run: npm run typecheck:e2e

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Docs check
        run: npm run docs:check

      - name: Build web
        run: npm run build:web

      - name: Check bundle budget
        run: npm run check:bundle

  e2e:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Playwright tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=list,github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  mobile-shard:
    name: Mobile suite (${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: webkit, shard: 1, of: 8 }
          - { engine: webkit, shard: 2, of: 8 }
          - { engine: webkit, shard: 3, of: 8 }
          - { engine: webkit, shard: 4, of: 8 }
          - { engine: webkit, shard: 5, of: 8 }
          - { engine: webkit, shard: 6, of: 8 }
          - { engine: webkit, shard: 7, of: 8 }
          - { engine: webkit, shard: 8, of: 8 }
          - { engine: chromium, shard: 1, of: 2 }
          - { engine: chromium, shard: 2, of: 2 }
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install ${{ matrix.engine }}

      - name: Mobile suite (PR subset, ${{ matrix.engine }} shard ${{ matrix.shard }}/${{ matrix.of }})
        run: npx cross-env E2E_SERVER=build playwright test --project=mobile-suite-${{ matrix.engine }} --workers=3 --shard=${{ matrix.shard }}/${{ matrix.of }} --reporter=list,github,html,./e2e/mobile/gallery-reporter.ts
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload mobile gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gallery-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/mobile-gallery/
          retention-days: 7

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report-${{ matrix.engine }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Mobile suite
    runs-on: ubuntu-latest
    needs: mobile-shard
    if: ${{ always() }}
    steps:
      - name: Every mobile shard passed
        run: |
          echo "Mobile shards: ${{ needs.mobile-shard.result }}"
          test "${{ needs.mobile-shard.result }}" = "success"
