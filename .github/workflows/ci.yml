name: CI

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Fast gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run typecheck:web

      - name: Type-check e2e
        run: npm run typecheck:e2e

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Docs check
        run: npm run docs:check

      - name: Build web
        run: npm run build:web

      - name: Check bundle budget
        run: npm run check:bundle

  e2e:
    name: Playwright (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium --shard=${{ matrix.shard }}/6 --reporter=list,github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  broadcast:
    name: Broadcast scenes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Broadcast scenes against the -win32 baselines
        run: npx playwright test --project=broadcast --reporter=list,github,html
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-broadcast
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-broadcast
          path: test-results/
          retention-days: 7

  mobile-chromium:
    name: Mobile suite (chromium ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile suite (PR subset, chromium shard ${{ matrix.shard }}/3)
        run: npx cross-env E2E_SERVER=build playwright test --project=mobile-suite-chromium --workers=3 --shard=${{ matrix.shard }}/3 --reporter=list,github,html,./e2e/mobile/gallery-reporter.ts
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload mobile gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gallery-chromium-${{ matrix.shard }}
          path: test-results/mobile-gallery/
          retention-days: 7

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  mobile-webkit:
    name: Mobile suite (webkit ${{ matrix.shard }}/8)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Keep committed line endings on checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install webkit

      - name: Mobile suite (PR subset, webkit shard ${{ matrix.shard }}/8)
        run: npx cross-env E2E_SERVER=build playwright test --project=mobile-suite-webkit --workers=3 --shard=${{ matrix.shard }}/8 --reporter=list,github,html,./e2e/mobile/gallery-reporter.ts
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload mobile gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gallery-webkit-${{ matrix.shard }}
          path: test-results/mobile-gallery/
          retention-days: 7

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report-webkit-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  mobile:
    name: Mobile suite
    runs-on: ubuntu-latest
    needs: [mobile-chromium, mobile-webkit]
    if: ${{ always() }}
    steps:
      - name: Every mobile shard that ran passed
        run: |
          echo "Chromium shards: ${{ needs.mobile-chromium.result }}"
          echo "WebKit shards: ${{ needs.mobile-webkit.result }}"
          test "${{ needs.mobile-chromium.result }}" = "success"
          test "${{ needs.mobile-webkit.result }}" = "success" -o "${{ needs.mobile-webkit.result }}" = "skipped"
