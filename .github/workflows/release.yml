name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version and prerelease
        id: meta
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if (-not $refName) { throw "GITHUB_REF_NAME not set" }
          $version = if ($refName.StartsWith('v')) { $refName.Substring(1) } else { $refName }
          $isPrerelease = $version -match '-'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Derived version: $version; prerelease: $isPrerelease"

      - name: Set application version from tag (if needed)
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            npm version $version --no-git-tag-version
            Write-Host "Updated package.json version to $version"
          } else {
            Write-Host "package.json already at $version; no change"
          }

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload build artifacts (for reference)
        uses: actions/upload-artifact@v4
        with:
          name: utbt-launcher-${{ steps.meta.outputs.version }}-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UTBT Launcher v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes with VirusTotal Link
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $analysis = $env:VT_ANALYSIS
          if (-not $analysis -or -not $analysis.Trim()) {
            Write-Host "No VirusTotal analysis found."
            exit 0
          }

          $vtLinks = @()
          foreach ($entry in ($analysis -split "[`r`n,]+")) {
            $entry = $entry.Trim()
            if (-not $entry) { continue }
            $sep = $entry.IndexOf('=')
            if ($sep -lt 0) { continue }
            $filePath = $entry.Substring(0, $sep).Trim()
            $url = $entry.Substring($sep + 1).Trim()
            if (-not $url) { continue }
            $fileName = Split-Path $filePath -Leaf
            $vtLinks += "- [VirusTotal Scan Report for $fileName]($url)"
          }

          if ($vtLinks.Count -eq 0) {
            Write-Host "No VirusTotal links parsed."
            exit 0
          }

          $tagName = $env:TAG_NAME
          $currentBodyLines = @(gh release view $tagName --json body -q .body)
          $currentBody = ($currentBodyLines -join "`n").TrimEnd()

          $vtSection = "`n`n### Security Scan Results`n`n" + ($vtLinks -join "`n")
          $newBody = $currentBody + $vtSection

          $tempFile = [System.IO.Path]::Combine($env:RUNNER_TEMP, "release-notes.md")
          [System.IO.File]::WriteAllText($tempFile, $newBody, (New-Object System.Text.UTF8Encoding($false)))

          gh release edit $tagName --notes-file $tempFile
          Remove-Item $tempFile -Force
