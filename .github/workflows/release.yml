name: Build and Release Windows Installer

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Derive stable version, tag, and whether to release
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          if (-not $version) { throw "package.json version is empty" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Only stable X.Y.Z versions can be released; got '$version'. Test changes on staging before release."
          }
          $tag = "v$version"
          $tagExists = [bool](git tag -l $tag)
          $release = if ($tagExists) { 'false' } else { 'true' }
          "version=$version"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release=$release"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($release -eq 'true') {
            Write-Host "Releasing stable version $tag"
          } else {
            Write-Host "Tag $tag already exists; this push does not bump the version, so nothing to release."
          }

      - name: Install dependencies
        if: steps.meta.outputs.release == 'true'
        run: npm ci

      - name: Build Windows installer
        if: steps.meta.outputs.release == 'true'
        run: npm run build:win

      - name: Upload build artifacts (for reference)
        if: steps.meta.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: utbt-launcher-${{ steps.meta.outputs.version }}-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UTBT Launcher v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: VirusTotal Scan
        if: steps.meta.outputs.release == 'true'
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes with VirusTotal Link
        if: steps.meta.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          $analysis = $env:VT_ANALYSIS
          if (-not $analysis -or -not $analysis.Trim()) {
            Write-Host "No VirusTotal analysis found."
            exit 0
          }

          $vtLinks = @()
          foreach ($entry in ($analysis -split "[`r`n,]+")) {
            $entry = $entry.Trim()
            if (-not $entry) { continue }
            $sep = $entry.IndexOf('=')
            if ($sep -lt 0) { continue }
            $filePath = $entry.Substring(0, $sep).Trim()
            $url = $entry.Substring($sep + 1).Trim()
            if (-not $url) { continue }
            $fileName = Split-Path $filePath -Leaf
            $vtLinks += "- [VirusTotal Scan Report for $fileName]($url)"
          }

          if ($vtLinks.Count -eq 0) {
            Write-Host "No VirusTotal links parsed."
            exit 0
          }

          $tagName = $env:TAG_NAME
          $currentBodyLines = @(gh release view $tagName --json body -q .body)
          $currentBody = ($currentBodyLines -join "`n").TrimEnd()

          $vtSection = "`n`n### Security Scan Results`n`n" + ($vtLinks -join "`n")
          $newBody = $currentBody + $vtSection

          $tempFile = [System.IO.Path]::Combine($env:RUNNER_TEMP, "release-notes.md")
          [System.IO.File]::WriteAllText($tempFile, $newBody, (New-Object System.Text.UTF8Encoding($false)))

          gh release edit $tagName --notes-file $tempFile
          Remove-Item $tempFile -Force
