name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version and prerelease
        id: meta
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if (-not $refName) { throw "GITHUB_REF_NAME not set" }
          $version = if ($refName.StartsWith('v')) { $refName.Substring(1) } else { $refName }
          $isPrerelease = $version -match '-'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Derived version: $version; prerelease: $isPrerelease"

      - name: Set application version from tag (if needed)
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            npm version $version --no-git-tag-version
            Write-Host "Updated package.json version to $version"
          } else {
            Write-Host "package.json already at $version; no change"
          }

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload build artifacts (for reference)
        uses: actions/upload-artifact@v4
        with:
          name: utbt-launcher-${{ steps.meta.outputs.version }}-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Notes
        id: notes
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          # Generate base notes from GitHub
          $changelog = gh release generate-notes $tagName
          
          $analysis = @"
          ${{ steps.vt.outputs.analysis }}
          "@
          
          $vtSection = ""
          if ($analysis) {
            $lines = $analysis -split "`n" | Where-Object { $_ -match '=' }
            $vtLinks = $lines | ForEach-Object {
                $parts = $_ -split '=', 2
                $fileName = Split-Path $parts[0] -Leaf
                "- [VirusTotal Scan Report for $fileName]($($parts[1]))"
            }
            $vtSection = "`n`n### Security Scan Results`n" + ($vtLinks -join "`n")
          }
          
          $fullBody = $changelog + $vtSection
          
          # Using multiline output syntax for GITHUB_OUTPUT
          $delimiter = [System.Guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $fullBody
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UTBT Launcher v${{ steps.meta.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
