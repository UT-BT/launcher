name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive version and prerelease
        id: meta
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if (-not $refName) { throw "GITHUB_REF_NAME not set" }
          $version = if ($refName.StartsWith('v')) { $refName.Substring(1) } else { $refName }
          $isPrerelease = $version -match '-'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Derived version: $version; prerelease: $isPrerelease"

      - name: Set application version from tag (if needed)
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $pkg = Get-Content package.json | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            npm version $version --no-git-tag-version
            Write-Host "Updated package.json version to $version"
          } else {
            Write-Host "package.json already at $version; no change"
          }

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload build artifacts (for reference)
        uses: actions/upload-artifact@v4
        with:
          name: utbt-launcher-${{ steps.meta.outputs.version }}-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UTBT Launcher v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes with VirusTotal Link
        shell: pwsh
        run: |
          $analysis = @"
          ${{ steps.vt.outputs.analysis }}
          "@
          if (-not $analysis) {
            Write-Host "No VirusTotal analysis found."
            exit 0
          }
          $lines = $analysis -split "`n" | Where-Object { $_ -match '=' }
          $vtLinks = $lines | ForEach-Object {
              $parts = $_ -split '=', 2
              $fileName = Split-Path $parts[0] -Leaf
              "- [VirusTotal Scan Report for $fileName]($($parts[1]))"
          }
          $vtSection = "`n`n### Security Scan Results`n" + ($vtLinks -join "`n")
          
          $tagName = "${{ github.ref_name }}"
          # Get current body
          $currentBody = gh release view $tagName --json body -q .body
          # Update body
          $newBody = "$currentBody$vtSection"
          gh release edit $tagName --notes "$newBody"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with RC Link
        if: steps.meta.outputs.prerelease == 'true'
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $readmePath = "README.md"
          $content = Get-Content -Path $readmePath -Raw
          
          $badgeUrlStart = "https://img.shields.io/github/v/release/UT-BT/launcher?include_prereleases"
          $pattern = "\[!\[rc\]\(.*$([regex]::Escape($badgeUrlStart)).*\)\]\(.*\)"
          
          $newLink = "https://github.com/UT-BT/launcher/releases/tag/$tagName"
          $replacement = "[![rc](https://img.shields.io/github/v/release/UT-BT/launcher?include_prereleases&sort=semver&label=rc&color=orange)]($newLink)"
          
          if ($content -match $pattern) {
              $newContent = $content -replace $pattern, $replacement
              Set-Content -Path $readmePath -Value $newContent
              
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add $readmePath
              git commit -m "chore: update readme with latest rc link [skip ci]"
              git push origin HEAD:main
          } else {
              Write-Warning "Could not find RC badge pattern in README.md"
          }
