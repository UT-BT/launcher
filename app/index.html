<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="UTBT" />
    <meta name="description" content="UTBT.net BunnyTrack records, maps, players, teams, and community activity." />
    <title>UTBT.net</title>
    <script>
      try {
        var defaultTheme = 'classic'
        var lightThemes = ['light']
        var t = JSON.parse(localStorage.getItem('utbt:theme:v1') || '{}').id
        if (t && t !== defaultTheme) document.documentElement.setAttribute('data-theme', t)
        if (lightThemes.indexOf(t) >= 0) document.documentElement.classList.remove('dark')
      } catch {}
      try {
        var seg = location.pathname.split('/').filter(Boolean)
        var streamRoute = (seg[0] === 'stream' && seg.length === 4) || (seg[0] === 'events' && seg[2] === 'matches' && seg[4] === 'stream' && seg.length === 5)
        var seasonalTheme = 'seasonal'
        var entries = ['spring', 'summer', 'autumn', 'winter', 'easter', 'halloween', 'christmas', 'christmas-summer']
        var seasonMonths = ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter']
        var southernZones = [
          'Africa/Blantyre', 'Africa/Brazzaville', 'Africa/Bujumbura', 'Africa/Dar_es_Salaam', 'Africa/Gaborone',
          'Africa/Harare', 'Africa/Johannesburg', 'Africa/Kigali', 'Africa/Kinshasa', 'Africa/Luanda',
          'Africa/Lubumbashi', 'Africa/Lusaka', 'Africa/Maputo', 'Africa/Maseru', 'Africa/Mbabane', 'Africa/Nairobi',
          'Africa/Windhoek', 'America/Araguaina', 'America/Argentina/Buenos_Aires', 'America/Argentina/Catamarca',
          'America/Argentina/ComodRivadavia', 'America/Argentina/Cordoba', 'America/Argentina/Jujuy',
          'America/Argentina/La_Rioja', 'America/Argentina/Mendoza', 'America/Argentina/Rio_Gallegos',
          'America/Argentina/Salta', 'America/Argentina/San_Juan', 'America/Argentina/San_Luis',
          'America/Argentina/Tucuman', 'America/Argentina/Ushuaia', 'America/Asuncion', 'America/Bahia',
          'America/Belem', 'America/Buenos_Aires', 'America/Campo_Grande', 'America/Catamarca', 'America/Cordoba',
          'America/Coyhaique', 'America/Cuiaba', 'America/Eirunepe', 'America/Fortaleza', 'America/Guayaquil',
          'America/Jujuy', 'America/La_Paz', 'America/Lima', 'America/Maceio', 'America/Manaus', 'America/Mendoza',
          'America/Montevideo', 'America/Noronha', 'America/Porto_Acre', 'America/Porto_Velho',
          'America/Punta_Arenas', 'America/Recife', 'America/Rio_Branco', 'America/Rosario', 'America/Santarem',
          'America/Santiago', 'America/Sao_Paulo', 'Antarctica/Casey', 'Antarctica/Davis',
          'Antarctica/DumontDUrville', 'Antarctica/Macquarie', 'Antarctica/Mawson', 'Antarctica/McMurdo',
          'Antarctica/Palmer', 'Antarctica/Rothera', 'Antarctica/South_Pole', 'Antarctica/Syowa', 'Antarctica/Troll',
          'Antarctica/Vostok', 'Asia/Dili', 'Asia/Jakarta', 'Asia/Jayapura', 'Asia/Makassar', 'Asia/Pontianak',
          'Asia/Ujung_Pandang', 'Atlantic/South_Georgia', 'Atlantic/St_Helena', 'Atlantic/Stanley', 'Australia/ACT',
          'Australia/Adelaide', 'Australia/Brisbane', 'Australia/Broken_Hill', 'Australia/Canberra',
          'Australia/Currie', 'Australia/Darwin', 'Australia/Eucla', 'Australia/Hobart', 'Australia/LHI',
          'Australia/Lindeman', 'Australia/Lord_Howe', 'Australia/Melbourne', 'Australia/NSW', 'Australia/North',
          'Australia/Perth', 'Australia/Queensland', 'Australia/South', 'Australia/Sydney', 'Australia/Tasmania',
          'Australia/Victoria', 'Australia/West', 'Australia/Yancowinna', 'Brazil/Acre', 'Brazil/DeNoronha',
          'Brazil/East', 'Brazil/West', 'Chile/Continental', 'Chile/EasterIsland', 'Indian/Antananarivo',
          'Indian/Chagos', 'Indian/Christmas', 'Indian/Cocos', 'Indian/Comoro', 'Indian/Kerguelen', 'Indian/Mahe',
          'Indian/Mauritius', 'Indian/Mayotte', 'Indian/Reunion', 'NZ', 'NZ-CHAT', 'Pacific/Apia', 'Pacific/Auckland',
          'Pacific/Bougainville', 'Pacific/Chatham', 'Pacific/Easter', 'Pacific/Efate', 'Pacific/Enderbury',
          'Pacific/Fakaofo', 'Pacific/Fiji', 'Pacific/Funafuti', 'Pacific/Galapagos', 'Pacific/Gambier',
          'Pacific/Guadalcanal', 'Pacific/Kanton', 'Pacific/Marquesas', 'Pacific/Nauru', 'Pacific/Niue',
          'Pacific/Norfolk', 'Pacific/Noumea', 'Pacific/Pago_Pago', 'Pacific/Pitcairn', 'Pacific/Port_Moresby',
          'Pacific/Rarotonga', 'Pacific/Samoa', 'Pacific/Tahiti', 'Pacific/Tongatapu', 'Pacific/Wallis', 'US/Samoa'
        ]
        var isEntry = function (v) { return entries.indexOf(v) >= 0 }
        var valid = function (v) { return v === 'none' || isEntry(v) }
        var isHemisphere = function (v) { return v === 'north' || v === 'south' }
        var stored = function (key) {
          try { return JSON.parse(localStorage.getItem(key) || 'null') } catch { return null }
        }
        var hemisphere = function () {
          var preview = new URLSearchParams(location.search).get('hemisphere')
          if (!isHemisphere(preview)) preview = sessionStorage.getItem('utbt:hemisphereOverride:v1')
          if (isHemisphere(preview)) return preview
          var setting = stored('utbt:hemisphere:v1')
          if (isHemisphere(setting)) return setting
          var zone
          try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone } catch {}
          return southernZones.indexOf(zone) >= 0 ? 'south' : 'north'
        }
        var root = document.documentElement
        if (!streamRoute) {
          var param = new URLSearchParams(location.search).get('season')
          var preview = valid(param) ? param : sessionStorage.getItem('utbt:seasonOverride:v1')
          if (!valid(preview)) preview = localStorage.getItem('utbt:seasonPin:v1')
          var season = null
          if (valid(preview)) {
            if (isEntry(preview)) {
              season = preview
              root.setAttribute('data-theme', seasonalTheme)
              root.classList.add('dark')
            }
          } else if (t === seasonalTheme) {
            var cached = stored('utbt:season:v2')
            if (cached && cached.until > Date.now() && isEntry(cached.id)) season = cached.id
            else season = seasonMonths[(new Date().getMonth() + (hemisphere() === 'south' ? 6 : 0)) % 12]
          }
          if (season) root.setAttribute('data-season', season)
        }
      } catch {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/renderer-web.tsx"></script>
  </body>
</html>
