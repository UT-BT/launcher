<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>UTBT.net</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('utbt:theme:v1') || '{}').id
        if (t && t !== 'classic') document.documentElement.setAttribute('data-theme', t)
      } catch {}
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/renderer.tsx"></script>
  </body>
</html>
