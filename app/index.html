<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="UTBT.net BunnyTrack records, maps, players, teams, and community activity." />
    <title>UTBT.net</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('utbt:theme:v1') || '{}').id
        if (t && t !== 'classic') document.documentElement.setAttribute('data-theme', t)
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch {}
    </script>
  </head>

  <body>
    <div id="app"><!--utbt-body--></div>
    <script type="module" src="/renderer-web.tsx"></script>
  </body>
</html>
