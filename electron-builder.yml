appId: com.utbt.launcher
productName: UTBT
directories:
  buildResources: resources/build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vite.config.web.{js,ts,mjs,cjs}'
  - '!dist-web/**'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: utbt
  icon: resources/build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: resources/build/icon.ico
  uninstallerIcon: resources/build/icon.ico
  installerHeaderIcon: resources/build/icon.ico
  menuCategory: true
  language: 1033
  installerSidebar: resources/build/installerSidebar.bmp
  packElevateHelper: true
  perMachine: true
  warningsAsErrors: false
  license: LICENSE
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
npmRebuild: false
publish:
  provider: github
  owner: UT-BT
  repo: launcher
