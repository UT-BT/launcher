appId: com.utbt.launcher
productName: UTBT
directories:
  buildResources: resources/build
files:
  - out/**
  - resources/**
  - '!node_modules/koffi/{doc,src,vendor}/**'
  - '!node_modules/koffi/build/koffi/{darwin,freebsd,linux,musl,openbsd}_*/**'
asarUnpack:
  - resources/**
  - node_modules/koffi/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: utbt
  icon: resources/build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: resources/build/icon.ico
  uninstallerIcon: resources/build/icon.ico
  installerHeaderIcon: resources/build/icon.ico
  menuCategory: true
  language: 1033
  warningsAsErrors: false
  displayLanguageSelector: false
npmRebuild: false
publish:
  provider: github
  owner: UT-BT
  repo: launcher
